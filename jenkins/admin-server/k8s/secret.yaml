apiVersion: v1
kind: Secret
metadata:
  name: flexpay-admin-server-secrets
  labels:
    app.kubernetes.io/name: flexpay-admin-server
type: Opaque
stringData:
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
