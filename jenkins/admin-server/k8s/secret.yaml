# ════════════════════════════════════════════════════════════════════════
# Kubernetes Secret — flexpay-admin-server
#
# IMPORTANT : Remplacer les valeurs avant d'appliquer.
# En production, utiliser un outil de gestion de secrets
# (Sealed Secrets, External Secrets, etc.)
