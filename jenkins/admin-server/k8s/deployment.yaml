# ════════════════════════════════════════════════════════════════════════
# Kubernetes Deployment — flexpay-admin-server
#
# L'image est tirée du registry local de la VM Ubuntu.
# Le tag de l'image est mis à jour par le Jenkinsfile via :
#   kubectl set image deployment/flexpay-admin-server ...
#
# IMPORTANT : l'image initiale (placeholder) sera remplacée au premier
# déploiement Jenkins. Pour un apply manuel, remplacer HOST_IP:
#   sed "s|HOST_IP|$(hostname -I | awk '{print $1}')|g" deployment.yaml | kubectl apply -f -
# ════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexpay-admin-server
  labels:
    app.kubernetes.io/name: flexpay-admin-server
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: flexpay
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flexpay-admin-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flexpay-admin-server
        app.kubernetes.io/component: monitoring
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: flexpay-admin-server
          image: localhost:5000/flexpay-admin-server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: flexpay-admin-server-config
            - secretRef:
                name: flexpay-admin-server-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
