# ════════════════════════════════════════════════════════════════════════
# Prometheus — Configuration de scraping FlexPay
#
# Prometheus tourne en Docker sur la VM Ubuntu.
# Les microservices tournent dans Minikube (réseau minikube).
# L'IP Minikube est injectée via la variable HOST_IP dans le .env.
# ════════════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # ── Prometheus lui-même ──────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── FlexPay Admin Server (K8s via NodePort 30090) ────────────────────
  - job_name: "flexpay-admin-server"
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:30090"]
        labels:
          application: "admin-server"
          environment: "prod"

  # ── FlexPay Gateway Service (K8s via NodePort 30080) ──────────────────
  - job_name: "flexpay-gateway"
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:30080"]
        labels:
          application: "gateway-service"
          environment: "prod"

  # ── FlexPay User Service (K8s via NodePort 30001) ─────────────────────
  - job_name: "flexpay-user-service"
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:30001"]
        labels:
          application: "user-service"
          environment: "prod"

  # ── FlexPay Messaging Service (K8s via NodePort 30004) ─────────────────
  - job_name: "flexpay-messaging-service"
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:30004"]
        labels:
          application: "messaging-service"
          environment: "prod"

  # ── FlexPay KYC Service (K8s via NodePort 30002) ───────────────────────
  - job_name: "flexpay-kyc-service"
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:30002"]
        labels:
          application: "kyc-service"
          environment: "prod"

  # ── FlexPay Payment Service ──────────────────────────────────────────
