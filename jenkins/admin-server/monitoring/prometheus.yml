# ════════════════════════════════════════════════════════════════════════
# Prometheus — Configuration de scraping FlexPay
#
# Prometheus tourne en Docker sur la VM Ubuntu.
# Les microservices tournent dans Minikube (réseau minikube).
# L'IP Minikube est injectée via la variable HOST_IP dans le .env.
# ════════════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # ── Prometheus lui-même ──────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── FlexPay Admin Server (K8s via NodePort 30090) ────────────────────
  - job_name: "flexpay-admin-server"
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:30090"]
        labels:
          application: "admin-server"
          environment: "prod"

