# ════════════════════════════════════════════════════════════════════════
# Jenkins Configuration as Code (JCasC) — Jenkins 2.555.1
# flexpay-admin-server-service
#
# Architecture :
#   - VM Ubuntu avec Docker Engine
#   - Jenkins = container Docker (docker.sock monte)
#   - Registry Docker local = localhost:5000 (sans auth)
#   - Minikube (Docker driver) sur la meme VM
#
# Chargement :
#   Manage Jenkins -> Configuration as Code -> Replace configuration
#
# APRES le chargement, configurer manuellement :
#   1. Credential kubeconfig (Secret file) :
#      Manage Jenkins -> Credentials -> Add -> Secret file
#      ID : kubeconfig-file | File : kubeconfig
#   2. Email :
#      Manage Jenkins -> System -> Extended E-mail Notification
#   3. Outils (Maven, JDK, Dependency-Check) :
#      Manage Jenkins -> Tools
#   4. Job multibranch :
#      New Item -> Multibranch Pipeline -> flexpay-admin-server
# ════════════════════════════════════════════════════════════════════════

jenkins:
  systemMessage: "Jenkins CI/CD - FlexPay Platform - VM Ubuntu / Docker Engine + Registry local + Kubernetes"
  numExecutors: 2
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
          name: "Jenkins Admin"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Administrateurs Jenkins"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "${JENKINS_ADMIN_USER:-admin}"
          - name: "developer"
            description: "Developpeurs - lecture + build"
            permissions:
              - "Overall/Read"
              - "Job/Build"
              - "Job/Read"
              - "Job/Workspace"
              - "Job/Cancel"
              - "Run/Replay"
            entries:
              - group: "developers"
          - name: "viewer"
            description: "Lecture seule"
            permissions:
              - "Overall/Read"
              - "Job/Read"
            entries:
              - group: "viewers"

  globalNodeProperties:
    - envVars:
        env:
          - key: "JAVA_HOME"
            value: "/opt/java/openjdk"
          - key: "MAVEN_OPTS"
            value: "-Xmx1024m"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USER:-weladjilarsen}"
              password: "${GITHUB_TOKEN:-token}"
              description: "GitHub - acces aux repos FlexPay"
          - usernamePassword:
              scope: GLOBAL
              id: "admin-server-credentials"
              username: "${ADMIN_SERVER_USERNAME:-admin}"
              password: "${ADMIN_SERVER_PASSWORD:-changeme}"
              description: "Spring Security credentials pour admin-server"

unclassified:
  scmGit:
    globalConfigName: "Jenkins CI"
    globalConfigEmail: "ci@flexpay.com"
