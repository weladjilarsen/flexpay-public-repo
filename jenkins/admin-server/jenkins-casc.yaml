# ════════════════════════════════════════════════════════════════════════
# Jenkins Configuration as Code (JCasC) — Jenkins 2.555.1
# flexpay-admin-server-service
#
# Architecture :
#   - VM Ubuntu avec Docker Engine
#   - Jenkins = container Docker (docker.sock monte)
#   - Registry Docker local = localhost:5000 (sans auth)
#   - Minikube (Docker driver) sur la meme VM
#
# Chargement :
#   Automatique au démarrage du container (via CASC_JENKINS_CONFIG)
#   Rechargement à chaud : Manage Jenkins -> Configuration as Code -> Reload existing configuration
#
# APRES le chargement, configurer manuellement :
#   1. Outils (Maven, JDK, Dependency-Check) :
#      Manage Jenkins -> Tools
#   2. Job multibranch :
#      New Item -> Multibranch Pipeline -> flexpay-admin-server
# ════════════════════════════════════════════════════════════════════════

jenkins:
  systemMessage: "Jenkins CI/CD - FlexPay Platform - VM Ubuntu / Docker Engine + Registry local + Kubernetes"
  numExecutors: 2
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
          name: "Jenkins Admin"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Administrateurs Jenkins"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "${JENKINS_ADMIN_USER:-admin}"
          - name: "developer"
            description: "Developpeurs - lecture + build"
            permissions:
              - "Overall/Read"
              - "Job/Build"
              - "Job/Read"
              - "Job/Workspace"
              - "Job/Cancel"
              - "Run/Replay"
            entries:
              - group: "developers"
          - name: "viewer"
            description: "Lecture seule"
            permissions:
              - "Overall/Read"
              - "Job/Read"
            entries:
              - group: "viewers"

  globalNodeProperties:
    - envVars:
        env:
          - key: "JAVA_HOME"
            value: "/opt/java/openjdk"
          - key: "MAVEN_OPTS"
            value: "-Xmx1024m"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USER:-weladjilarsen}"
              password: "${GITHUB_TOKEN:-token}"
              description: "GitHub - acces aux repos FlexPay"
          - usernamePassword:
              scope: GLOBAL
              id: "admin-server-credentials"
              username: "${ADMIN_SERVER_USERNAME:-admin}"
              password: "${ADMIN_SERVER_PASSWORD:-changeme}"
              description: "Spring Security credentials pour admin-server"
          - string:
              scope: GLOBAL
              id: "flexpay-jwt-secret"
              secret: "${FLEXPAY_JWT_SECRET}"
              description: "Clé secrète JWT pour la signature des tokens"
          - usernamePassword:
              scope: GLOBAL
              id: "user-service-db-credentials"
              username: "${USER_SERVICE_DB_USERNAME:-postgres}"
              password: "${USER_SERVICE_DB_PASSWORD}"
              description: "Credentials PostgreSQL pour user-service (flexpay_userdb)"
          - string:
              scope: GLOBAL
              id: "user-service-db-url"
              secret: "${USER_SERVICE_DB_URL}"
              description: "JDBC URL PostgreSQL pour user-service"
          - usernamePassword:
              scope: GLOBAL
              id: "rabbitmq-credentials"
              username: "${RABBITMQ_USERNAME:-guest}"
              password: "${RABBITMQ_PASSWORD:-guest}"
              description: "Credentials RabbitMQ pour les microservices FlexPay"
          - file:
              scope: GLOBAL
              id: "kubeconfig-file"
              fileName: "kubeconfig"
              secretBytes: "${KUBECONFIG_EMBEDDED_B64}"
              description: "Kubeconfig Minikube (certificats embarqués) pour kubectl dans les pipelines"
          - usernamePassword:
              scope: GLOBAL
              id: "messaging-mail-credentials"
              username: "${MAIL_USERNAME}"
              password: "${MAIL_PASSWORD}"
              description: "SMTP Gmail - notifications pipeline FlexPay"
          - string:
              scope: GLOBAL
              id: "messaging-mail-from"
              secret: "${MAIL_FROM}"
              description: "Adresse email d'expedition pour le messaging-service"
          - string:
              scope: GLOBAL
              id: "messaging-infobip-api-key"
              secret: "${INFOBIP_API_KEY}"
              description: "Cle API Infobip pour SMS/WhatsApp (messaging-service)"
          - usernamePassword:
              scope: GLOBAL
              id: "kyc-service-db-credentials"
              username: "${KYC_SERVICE_DB_USERNAME:-postgres}"
              password: "${KYC_SERVICE_DB_PASSWORD}"
              description: "Credentials PostgreSQL pour kyc-service (flexpay_kycdb)"
          - string:
              scope: GLOBAL
              id: "kyc-service-db-url"
              secret: "${KYC_SERVICE_DB_URL}"
              description: "JDBC URL PostgreSQL pour kyc-service"
          - string:
              scope: GLOBAL
              id: "kyc-service-token"
              secret: "${KYC_SERVICE_TOKEN}"
              description: "Token d'authentification interne pour kyc-service"
          - usernamePassword:
              scope: GLOBAL
              id: "payment-service-db-credentials"
              username: "${PAYMENT_SERVICE_DB_USERNAME:-postgres}"
              password: "${PAYMENT_SERVICE_DB_PASSWORD}"
              description: "Credentials PostgreSQL pour payment-service (flexpay_paymentdb)"
          - string:
              scope: GLOBAL
              id: "payment-service-db-url"
              secret: "${PAYMENT_SERVICE_DB_URL}"
              description: "JDBC URL PostgreSQL pour payment-service"
          - usernamePassword:
              scope: GLOBAL
              id: "minio-credentials"
              username: "${MINIO_ACCESS_KEY:-minioadmin}"
              password: "${MINIO_SECRET_KEY:-minioadmin}"
              description: "Credentials MinIO S3 pour le stockage KYC (flexpay-kyc bucket)"
          - usernamePassword:
              scope: GLOBAL
              id: "admin-service-db-credentials"
              username: "${ADMIN_SERVICE_DB_USERNAME:-postgres}"
              password: "${ADMIN_SERVICE_DB_PASSWORD}"
              description: "Credentials PostgreSQL pour admin-service (flexpay_admindb)"
          - string:
              scope: GLOBAL
              id: "admin-service-db-url"
              secret: "${ADMIN_SERVICE_DB_URL}"
              description: "JDBC URL PostgreSQL pour admin-service"
          - file:
              scope: GLOBAL
              id: "admin-jwt-private-key"
              fileName: "admin-jwt-private-key.pem"
              secretBytes: "${ADMIN_JWT_PRIVATE_KEY_PATH}"
              description: "Admin JWT private key for admin service"
          - file:
              scope: GLOBAL
              id: "admin-jwt-public-key"
              fileName: "admin-jwt-public-key.pem"
              secretBytes: "${ADMIN_JWT_PUBLIC_KEY_PATH}"
              description: "Admin JWT public key for admin service"
          - string:
              scope: GLOBAL
              id: "admin-encryption-key"
              secret: "${ADMIN_ENCRYPTION_KEY}"
              description: "Encryption key for admin service"


unclassified:
  scmGit:
    globalConfigName: "Jenkins CI"
    globalConfigEmail: "ci@flexpay.com"

  mailer:
    smtpHost: "${MAIL_HOST}"
    smtpPort: "${MAIL_PORT}"
    useSsl: false
    useTls: true
    charset: "UTF-8"
    authentication:
      username: "${MAIL_USERNAME}"
      password: "${MAIL_PASSWORD}"
    replyToAddress: "${MAIL_FROM}"
    defaultSuffix: "@flexpay.com"

  email-ext:
    defaultReplyTo: "${MAIL_FROM}"
    defaultRecipients: "${EMAIL_RECIPIENTS}"
    mailAccount:
      smtpHost: "${MAIL_HOST}"
      smtpPort: "${MAIL_PORT}"
      useSsl: false
      useTls: true
      credentialsId: "messaging-mail-credentials"
