# ════════════════════════════════════════════════════════════════════════
# Jenkins Configuration as Code (JCasC)
# flexpay-admin-server-service
#
# Architecture :
#   - VM Ubuntu avec Docker Engine
#   - Jenkins = container Docker (docker.sock monte)
#   - Registry Docker local = localhost:5000 (sans auth)
#   - Minikube (Docker driver) sur la meme VM
#
# Chargement depuis le Mac :
#   Manage Jenkins -> Configuration as Code -> Replace configuration
#
# APRES le chargement JCasC, creer manuellement :
#   1. Credential kubeconfig :
#      Manage Jenkins -> Credentials -> System -> Global -> Add
#      Kind : Secret file | ID : kubeconfig-file | File : kubeconfig
#   2. Outils (Maven, JDK, Dependency-Check) :
#      Manage Jenkins -> Tools
#   3. Job multibranch :
#      New Item -> Multibranch Pipeline -> flexpay-admin-server
# ════════════════════════════════════════════════════════════════════════

jenkins:

  # ─────────────── CONFIGURATION SYSTEME ──────────────────────────────
  systemMessage: >-
    Jenkins CI/CD - FlexPay Platform
    VM Ubuntu / Docker Engine + Registry local + Kubernetes

  numExecutors: 2
  mode: NORMAL

  # ─────────────── SECURITE ───────────────────────────────────────────
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
          name: "Jenkins Admin"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Administrateurs Jenkins"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "${JENKINS_ADMIN_USER:-admin}"
          - name: "developer"
            description: "Developpeurs - lecture + build"
            permissions:
              - "Overall/Read"
              - "Job/Build"
              - "Job/Read"
              - "Job/Workspace"
              - "Job/Cancel"
              - "Run/Replay"
            entries:
              - group: "developers"
          - name: "viewer"
            description: "Lecture seule"
            permissions:
              - "Overall/Read"
              - "Job/Read"
            entries:
              - group: "viewers"

  # ─────────────── CONFIGURATION GLOBALE ──────────────────────────────
  globalNodeProperties:
    - envVars:
        env:
          - key: "JAVA_HOME"
            value: "/opt/java/openjdk"
          - key: "MAVEN_OPTS"
            value: "-Xmx1024m"

# ═══════════════════════════════════════════════════════════════════════
# CREDENTIALS
# ═══════════════════════════════════════════════════════════════════════
credentials:
  system:
    domainCredentials:
      - credentials:

          # ── Git / GitHub ─────────────────────────────────────────────
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USER:-weladjilarsen}"
              password: "${GITHUB_TOKEN:-token}"
              description: "GitHub - acces aux repos FlexPay"

          # ── Credentials du microservice ──────────────────────────────
          - usernamePassword:
              scope: GLOBAL
              id: "admin-server-credentials"
              username: "${ADMIN_SERVER_USERNAME:-admin}"
              password: "${ADMIN_SERVER_PASSWORD:-changeme}"
              description: "Spring Security credentials pour admin-server"

# ═══════════════════════════════════════════════════════════════════════
# CONFIGURATION DES PLUGINS
# ═══════════════════════════════════════════════════════════════════════
unclassified:

  # ── Email ─────────────────────────────────────────────────────────────
  emailext:
    defaultRecipients: "${EMAIL_RECIPIENTS:-devops@flexpay.com}"
    defaultContentType: "text/plain"
    defaultSubject: "$PROJECT_NAME - Build #$BUILD_NUMBER - $BUILD_STATUS"

  # ── Git ──────────────────────────────────────────────────────────────
  gitSCM:
    globalConfigName: "Jenkins CI"
    globalConfigEmail: "ci@flexpay.com"
