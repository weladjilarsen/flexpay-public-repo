# ════════════════════════════════════════════════════════════════════════
# Jenkins Configuration as Code (JCasC) — flexpay-messaging-service
#
# Credentials requises par le Jenkinsfile du messaging-service.
# Ces credentials sont déclarées dans le JCasC principal
# (jenkins/admin-server/jenkins-casc.yaml) qui est chargé au démarrage.
#
# Ce fichier sert de référence pour documenter ce dont le pipeline
# messaging-service a besoin dans Jenkins.
#
# Variables d'environnement requises dans le docker-compose Jenkins :
#   GITHUB_USER, GITHUB_TOKEN
#   ADMIN_SERVER_USERNAME, ADMIN_SERVER_PASSWORD
#   RABBITMQ_USERNAME, RABBITMQ_PASSWORD
#   MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM
#   INFOBIP_API_KEY
#   KUBECONFIG_EMBEDDED_B64
# ════════════════════════════════════════════════════════════════════════

credentials:
  system:
    domainCredentials:
      - credentials:

          # ── GitHub (checkout du code source) ──────────────────────────
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USER:-weladjilarsen}"
              password: "${GITHUB_TOKEN:-token}"
              description: "GitHub - acces aux repos FlexPay"

          # ── Spring Boot Admin (enregistrement du service) ─────────────
          - usernamePassword:
              scope: GLOBAL
              id: "admin-server-credentials"
              username: "${ADMIN_SERVER_USERNAME:-admin}"
              password: "${ADMIN_SERVER_PASSWORD:-changeme}"
              description: "Spring Security credentials pour admin-server"

          # ── RabbitMQ (messaging async) ────────────────────────────────
          - usernamePassword:
              scope: GLOBAL
              id: "rabbitmq-credentials"
              username: "${RABBITMQ_USERNAME:-guest}"
              password: "${RABBITMQ_PASSWORD:-guest}"
              description: "Credentials RabbitMQ pour les microservices FlexPay"

          # ── SMTP Mail (envoi d'emails) ────────────────────────────────
          - usernamePassword:
              scope: GLOBAL
              id: "messaging-mail-credentials"
              username: "${MAIL_USERNAME}"
              password: "${MAIL_PASSWORD}"
              description: "SMTP credentials pour le messaging-service"

          - string:
              scope: GLOBAL
              id: "messaging-mail-from"
              secret: "${MAIL_FROM}"
              description: "Adresse email d'expedition pour le messaging-service"

          # ── Infobip (SMS / WhatsApp) ──────────────────────────────────
          - string:
              scope: GLOBAL
              id: "messaging-infobip-api-key"
              secret: "${INFOBIP_API_KEY}"
              description: "Cle API Infobip pour SMS/WhatsApp (messaging-service)"

          # ── Kubeconfig (deploiement K8s) ──────────────────────────────
          # NOTE : le type 'file' est incompatible avec JCasC Jenkins 2.555.1
          # Creer manuellement via : Manage Jenkins → Credentials → Add →
          #   Kind: Secret file | ID: kubeconfig-file
          # - file:
          #     scope: GLOBAL
          #     id: "kubeconfig-file"
          #     fileName: "kubeconfig"
          #     secretBytes: "${KUBECONFIG_EMBEDDED_B64}"
          #     description: "Kubeconfig Minikube pour kubectl"
